services:
  db:
    image: postgres:16-alpine
    container_name: arsn_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arsn
      POSTGRES_PASSWORD: arsn_password
      POSTGRES_DB: arsn_db
    ports:
      - "5433:5432"
    volumes:
      - arsn_pgdata:/var/lib/postgresql/data

volumes:
  arsn_pgdata:
